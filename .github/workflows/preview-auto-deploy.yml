name: Hidden Doors website preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hidden-doors-website-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: [self-hosted, Linux, X64, hidden-doors-website-preview]
    timeout-minutes: 30

    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate preview source
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/robots.txt
          test -s site/sitemap.xml
          test -s site/404.html
          bash -n ops/hidden-doors-website-root.sh

      - name: Deploy isolated VPN preview
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          sudo -n /usr/local/sbin/hidden-doors-website deploy-preview "$GITHUB_WORKSPACE" "$SHA"

      - name: Preview URL
        if: always()
        shell: bash
        run: |
          {
            echo "## Hidden Doors preview"
            echo
            echo "Commit: `$(git rev-parse --short HEAD)`"
            echo
            echo "Preview: https://hidden-doors-site.138.124.69.108.sslip.io/"
            echo
            echo "Production was not modified."
          } >> "$GITHUB_STEP_SUMMARY"
