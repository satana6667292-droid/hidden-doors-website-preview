name: Bootstrap preview repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-preview.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Clone current approved preview source
        run: |
          git clone --depth 1 --branch preview/site-edits-2026-10-01 \
            https://github.com/satana6667292-droid/hidden-doors-website.git /tmp/source

      - name: Copy website into preview repository
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            /tmp/source/ ./

      - name: Commit mirrored preview baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bootstrap preview from current site preview"
          git push
